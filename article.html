<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Article · seek+scale.</title><link rel="stylesheet" href="assets/app.css"><link rel="manifest" href="manifest.json"></head><body><div class="shell"><nav class="side" id="side"></nav><main><a class="back" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg>Home</a><div id="article"><div class="loading">Loading…</div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
(async function(){try{await requireMember('home');var id=qs('id'),q=sb.from('posts').select('*');q=id?q.eq('id',id).single():q.in('category',['article','resource']).order('created_at',{ascending:false}).limit(1).maybeSingle();var r=await q;if(r.error)throw r.error;if(!r.data)return showPageError('article','Article not found.');var p=r.data;document.title=p.title+' · seek+scale.';var paragraphs=String(p.body||'').split(/\n\s*\n/).filter(Boolean).map(function(x){return '<p>'+esc(x)+'</p>';}).join('');document.getElementById('article').innerHTML='<div class="eyebrow">'+esc((p.category||'Article').toUpperCase())+' · '+esc(fmtDate(p.created_at))+'</div><h1 style="margin:9px 0 8px;font-size:27px">'+esc(p.title)+'</h1><p class="sub">'+esc([p.author_name,p.business_name,p.town].filter(Boolean).join(' · '))+'</p><div class="article">'+paragraphs+'</div>';}catch(e){if(!/signin|pending|suspended/.test(e.message))showPageError('article',e.message);}})();
</script></body></html>
