<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Directory · seek+scale.</title><link rel="stylesheet" href="assets/app.css"><link rel="manifest" href="manifest.json"></head><body><div class="shell"><nav class="side" id="side"></nav><main><h1>Directory</h1><p class="sub">Member businesses. Vouch for the ones you know.</p><div class="filters" id="filters"></div><div id="dirList"><div class="loading">Loading…</div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
(async function(){try{await requireMember('directory');var trade='All',list=await loadBusinesses();function render(){var cats=['All'];list.forEach(function(b){if(b.category&&cats.indexOf(b.category)<0)cats.push(b.category);});document.getElementById('filters').innerHTML=cats.map(function(t){return '<button class="fchip'+(t===trade?' on':'')+'" data-trade="'+esc(t)+'">'+esc(t)+'</button>';}).join('');var shown=list.filter(function(b){return trade==='All'||b.category===trade;}).sort(function(a,b){return b.vouch_count-a.vouch_count;});document.getElementById('dirList').innerHTML=shown.length?shown.map(function(b){return businessCard(b,{});}).join(''):'<div class="empty">No businesses in this category yet.</div>';}window.onVouchChange=render;document.addEventListener('click',function(e){var t=e.target.closest('[data-trade]');if(t){trade=t.dataset.trade;render();}});render();}catch(e){if(!/signin|pending|suspended/.test(e.message))showPageError('dirList',e.message);}})();
</script></body></html>
