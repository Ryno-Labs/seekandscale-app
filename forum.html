<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Forum · seek+scale.</title><link rel="stylesheet" href="assets/app.css"><link rel="manifest" href="manifest.json"></head><body><div class="shell"><nav class="side" id="side"></nav><main><h1>The Forum</h1><p class="sub">Thoughts, requests, giveaways and shout-outs. Nothing scrolls away.</p><div class="card composer"><textarea id="fAsk" placeholder="What's on your mind?"></textarea><div class="crow"><button class="act soft" id="fType">Thought</button><button class="btn sm" id="fPost" disabled style="margin-left:auto">Post it</button></div></div><p class="tiny" id="postMsg" style="margin:-3px 0 0 4px">Tap the type to change it.</p><div class="filters" style="margin-top:18px" id="segs"></div><div class="card" id="forumList"><div class="loading">Loading…</div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/data.js"></script><script src="assets/app.js"></script><script>
(async function(){try{await requireMember('forum');var seg='all',type='thought',posts=[];var ta=document.getElementById('fAsk'),btn=document.getElementById('fPost');function renderFilters(){document.getElementById('segs').innerHTML=[['all','Everything']].concat(FORUM_ORDER.map(function(k){return[k,FORUM_TYPES[k]+'s'];})).map(function(x){return '<button class="fchip'+(x[0]===seg?' on':'')+'" data-seg="'+x[0]+'">'+x[1]+'</button>';}).join('');}function render(){var list=posts.filter(function(p){return seg==='all'||p.category===seg;});document.getElementById('forumList').innerHTML=list.length?list.map(function(p){return '<div class="post"><div class="who"><div class="av" style="background:#111">'+esc(initials(p.author_name||p.business_name||'M').toUpperCase())+'</div><div><div class="n">'+esc(p.author_name||'Member')+(p.business_name?' · '+esc(p.business_name):'')+'</div><div class="t">'+esc([p.town,fmtTime(p.created_at)].filter(Boolean).join(' · '))+'</div></div><span class="chip" style="margin-left:auto">'+esc(FORUM_TYPES[p.category]||p.category||'Post')+'</span></div><p class="body">'+esc(p.body||'')+'</p>'+(p.author_id===SS.user.id?'<button class="act soft" data-delete-post="'+p.id+'">Take it down</button>':'')+'</div>';}).join(''):'<div class="empty">Nothing here yet.</div>';}async function reload(){posts=await loadPosts(FORUM_ORDER,200);render();}renderFilters();await reload();ta.addEventListener('input',function(){btn.disabled=ta.value.trim().length<4;ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';});document.getElementById('fType').onclick=function(){type=FORUM_ORDER[(FORUM_ORDER.indexOf(type)+1)%FORUM_ORDER.length];this.textContent=FORUM_TYPES[type];};document.getElementById('fPost').onclick=async function(){var body=ta.value.trim();if(body.length<4)return;this.disabled=true;document.getElementById('postMsg').textContent='Posting…';try{await createMemberPost(body,type);ta.value='';ta.style.height='auto';await reload();document.getElementById('postMsg').textContent='Posted.';}catch(e){document.getElementById('postMsg').textContent=e.message;}finally{this.disabled=true;}};document.addEventListener('click',async function(e){var s=e.target.closest('[data-seg]');if(s){seg=s.dataset.seg;renderFilters();render();return;}var d=e.target.closest('[data-delete-post]');if(d&&confirm('Take this post down?')){var r=await sb.from('posts').delete().eq('id',d.dataset.deletePost);if(r.error)alert(r.error.message);else reload();}});}catch(e){if(!/signin|pending|suspended/.test(e.message))showPageError('forumList',e.message);}})();
</script></body></html>
