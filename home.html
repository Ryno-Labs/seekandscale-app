<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Home · seek+scale.</title>
<link rel="stylesheet" href="assets/app.css?v=ux2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/favicon-32.png">
</head>
<body>
<header class="top" id="top"></header>

<div class="shell">
  <aside class="side" id="side"></aside>

  <main>
    <div class="compact-page-head">
      <div class="head-copy">
        <h1>For you</h1>
        <p class="sub">What needs your attention right now.</p>
      </div>
      <button class="btn sm post-button" id="openPost" type="button">+ Post</button>
    </div>

    <section class="priority-block">
      <div class="priority-head">
        <h2>Needs you</h2>
        <a href="opportunities.html">See all</a>
      </div>
      <div id="matchedOpps"><div class="loading">Finding relevant opportunities…</div></div>
    </section>

    <section class="priority-block">
      <div class="priority-head">
        <h2>Can you help?</h2>
      </div>
      <div id="unanswered"><div class="loading">Finding questions…</div></div>
    </section>

    <section class="priority-block">
      <div class="priority-head">
        <h2>Around the room</h2>
      </div>
      <div id="room"><div class="loading">Loading the room…</div></div>
    </section>
  </main>
</div>

<nav class="tabs" id="tabs"></nav>
<a class="help-fab" href="helpdesk.html">Get help</a>

<!-- POST CHOICE -->
<div class="sheet-backdrop" id="postSheet" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="postSheetTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="postSheetTitle">What do you want to do?</h2>
      <button class="sheet-close" id="closePost" type="button" aria-label="Close">×</button>
    </div>

    <div id="choiceView">
      <button class="post-choice" id="chooseAsk" type="button">
        <span class="post-choice-icon">?</span>
        <span><strong>Ask for help</strong><span>I’m stuck on something.</span></span>
        <span class="post-choice-arrow">›</span>
      </button>

      <a class="post-choice" href="opportunities.html#new">
        <span class="post-choice-icon">↗</span>
        <span><strong>Post an opportunity</strong><span>Work, referral, hire or person needed.</span></span>
        <span class="post-choice-arrow">›</span>
      </a>

      <button class="post-choice" id="chooseShare" type="button">
        <span class="post-choice-icon">+</span>
        <span><strong>Share something</strong><span>A win, lesson, update or useful thought.</span></span>
        <span class="post-choice-arrow">›</span>
      </button>
    </div>

    <div id="askView" hidden>
      <button class="act" id="backAsk" type="button" style="margin-bottom:14px">← Back</button>
      <div class="field">
        <label for="stuck">What’s going on?</label>
        <textarea id="stuck" maxlength="2000" placeholder="What are you trying to solve?"></textarea>
      </div>
      <div class="field">
        <label for="tried">What have you tried? <span class="dim">(optional)</span></label>
        <textarea id="tried" maxlength="2000" placeholder="Anything the room should know."></textarea>
      </div>
      <div class="field">
        <label for="result">What would a good result look like? <span class="dim">(optional)</span></label>
        <textarea id="result" maxlength="2000" placeholder="What are you trying to make happen?"></textarea>
      </div>
      <button class="btn wide" id="postAsk" type="button">Post question</button>
      <div class="message" id="askMsg"></div>
    </div>

    <div id="shareView" hidden>
      <button class="act" id="backShare" type="button" style="margin-bottom:14px">← Back</button>
      <div class="field">
        <label for="shareBody">What do you want to share?</label>
        <textarea id="shareBody" maxlength="4000" placeholder="A win, lesson, update or useful thought."></textarea>
      </div>
      <button class="btn wide" id="postShare" type="button">Post</button>
      <div class="message" id="shareMsg"></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js?v=community-v1"></script>
<script src="assets/app.js?v=ux2"></script>
<script>
(async function(){
  'use strict';

  function openSheet(){
    SS.$('postSheet').hidden=false;
    showChoice();
  }

  function closeSheet(){
    SS.$('postSheet').hidden=true;
  }

  function showChoice(){
    SS.$('choiceView').hidden=false;
    SS.$('askView').hidden=true;
    SS.$('shareView').hidden=true;
  }

  function showAsk(){
    SS.$('choiceView').hidden=true;
    SS.$('askView').hidden=false;
    SS.$('shareView').hidden=true;
    setTimeout(function(){SS.$('stuck').focus();},0);
  }

  function showShare(){
    SS.$('choiceView').hidden=true;
    SS.$('askView').hidden=true;
    SS.$('shareView').hidden=false;
    setTimeout(function(){SS.$('shareBody').focus();},0);
  }

  function postHtml(p,rs){
    var m=p.author||{full_name:'Seek & Scale'},b=p.business||{};
    rs=rs||[];
    var label=p.subtype==='introduction'?'New member':p.category;

    return '<article class="feed-post" data-post="'+SS.esc(p.id)+'">'+
      '<div class="post-head">'+SS.avatar(m)+
        '<div class="post-meta">'+
          '<div class="post-name">'+SS.esc(m.full_name||'Seek & Scale')+'</div>'+
          '<div class="post-business">'+SS.esc(SS.businessLine(m,b))+'</div>'+
        '</div>'+
        '<span class="chip '+((p.category==='announcement'||p.subtype==='introduction')?'yellow':'')+'">'+SS.esc(label)+'</span>'+
      '</div>'+
      '<div class="post-body">'+SS.esc(p.body)+'</div>'+
      '<div class="post-tools">'+
        '<span class="tiny">'+SS.esc(SS.fmtTime(p.created_at))+' · '+rs.length+' '+(rs.length===1?'reply':'replies')+'</span>'+
        (p.author_member_id===SS.ctx.member.id
          ? '<button class="act danger" type="button" data-delete-post="'+SS.esc(p.id)+'">Delete</button>'
          : '')+
      '</div>'+
      '<div class="reply-list">'+
        rs.map(function(r){
          var rm=r.author||{full_name:'Member'};
          return '<div class="reply">'+
            '<div class="reply-name">'+SS.esc(rm.full_name||'Member')+'</div>'+
            '<div class="reply-body">'+SS.esc(r.body)+'</div>'+
          '</div>';
        }).join('')+
        '<div class="reply-form">'+
          '<input data-reply-input="'+SS.esc(p.id)+'" placeholder="Write a useful reply..." maxlength="2000">'+
          '<button class="act solid" type="button" data-reply="'+SS.esc(p.id)+'">Reply</button>'+
        '</div>'+
      '</div>'+
    '</article>';
  }

  async function loadMatchedOpportunities(){
    var rows=await SS.loadOpportunities(['open'],80);
    rows=rows.filter(function(o){return o.poster_member_id!==SS.ctx.member.id;});

    rows.forEach(function(o){
      o._score=SS.opportunityMatchScore(o,SS.ctx.business);
    });

    rows=rows
      .filter(function(o){return o._score>=2;})
      .sort(function(a,b){
        if(b._score!==a._score)return b._score-a._score;
        return new Date(b.created_at)-new Date(a.created_at);
      })
      .slice(0,3);

    if(!rows.length){
      SS.$('matchedOpps').innerHTML=
        '<div class="priority-list">'+
          '<div class="priority-item">'+
            '<div class="priority-item-title">Nothing matching you right now.</div>'+
            '<div class="priority-item-meta">Real opportunities only. Browse the full board or see who is in the network.</div>'+
            '<div class="priority-item-tools">'+
              '<a class="act" href="opportunities.html">Open opportunities</a>'+
              '<a class="act" href="directory.html">Members</a>'+
            '</div>'+
          '</div>'+
        '</div>';
      return;
    }

    SS.$('matchedOpps').innerHTML=
      '<div class="priority-list">'+
      rows.map(function(o){
        var poster=o.poster||{full_name:'Member'};
        return '<article class="priority-item">'+
          '<div class="priority-item-title">'+SS.esc(o.need)+'</div>'+
          '<div class="priority-item-meta">'+
            SS.esc(o.trade_needed)+' · '+SS.esc(o.city)+' · '+SS.esc(o.timing)+' · '+SS.esc(poster.full_name)+
          '</div>'+
          '<div class="priority-item-tools">'+
            '<span class="chip yellow">'+(o._score>=3?'Strong match':'Trade match')+'</span>'+
            '<button class="act solid" type="button" data-claim-opportunity="'+SS.esc(o.id)+'">Claim</button>'+
            '<a class="act" href="opportunities.html">Details</a>'+
          '</div>'+
        '</article>';
      }).join('')+
      '</div>';
  }

  async function loadCommunity(){
    var posts=await SS.loadPosts(['discussion','question','win','announcement'],80);
    var replies=await SS.loadReplies(posts.map(function(p){return p.id;}));
    var byPost={};

    replies.forEach(function(r){
      (byPost[r.post_id]||(byPost[r.post_id]=[])).push(r);
    });

    var unanswered=posts.filter(function(p){
      return p.category==='question' && (byPost[p.id]||[]).length===0;
    }).slice(0,3);

    SS.$('unanswered').innerHTML=unanswered.length
      ? '<div class="priority-list">'+unanswered.map(function(p){return postHtml(p,[]);}).join('')+'</div>'
      : '<div class="priority-list"><div class="priority-item"><div class="priority-item-title">The room is caught up.</div><div class="priority-item-meta">No unanswered questions right now.</div></div></div>';

    var unansweredIds={};
    unanswered.forEach(function(p){unansweredIds[p.id]=true;});

    var around=posts
      .filter(function(p){return !unansweredIds[p.id];})
      .sort(function(a,b){
        if(!!a.is_pinned!==!!b.is_pinned)return a.is_pinned?-1:1;
        return new Date(b.created_at)-new Date(a.created_at);
      })
      .slice(0,25);

    SS.$('room').innerHTML=around.length
      ? '<div class="priority-list">'+around.map(function(p){return postHtml(p,byPost[p.id]||[]);}).join('')+'</div>'
      : '<div class="priority-list"><div class="priority-item">'+
          '<div class="priority-item-title">The room is new.</div>'+
          '<div class="priority-item-meta">See who is here, then post when you have something real to ask or share.</div>'+
          '<div class="priority-item-tools"><a class="act" href="directory.html">See members</a></div>'+
        '</div></div>';
  }

  try{
    await SS.requireMember('home');

    SS.$('openPost').addEventListener('click',openSheet);
    SS.$('closePost').addEventListener('click',closeSheet);
    SS.$('postSheet').addEventListener('click',function(e){
      if(e.target===SS.$('postSheet'))closeSheet();
    });
    SS.$('chooseAsk').addEventListener('click',showAsk);
    SS.$('chooseShare').addEventListener('click',showShare);
    SS.$('backAsk').addEventListener('click',showChoice);
    SS.$('backShare').addEventListener('click',showChoice);

    SS.$('postAsk').addEventListener('click',async function(){
      var stuck=SS.$('stuck').value.trim();
      var tried=SS.$('tried').value.trim();
      var result=SS.$('result').value.trim();

      if(stuck.length<4){
        SS.$('askMsg').textContent='Tell the room what is going on first.';
        SS.$('askMsg').className='message bad';
        return;
      }

      var body=stuck;
      if(tried)body+='\n\nWhat I’ve tried:\n'+tried;
      if(result)body+='\n\nA good result would be:\n'+result;

      var btn=this;
      btn.disabled=true;
      btn.textContent='Posting…';

      try{
        var r=await SS.client.from('posts').insert({
          author_member_id:SS.ctx.member.id,
          category:'question',
          subtype:'structured-ask',
          body:body
        });
        if(r.error)throw r.error;

        SS.$('stuck').value='';
        SS.$('tried').value='';
        SS.$('result').value='';
        closeSheet();
        await loadCommunity();
      }catch(e){
        SS.$('askMsg').textContent=e.message||'Could not post question.';
        SS.$('askMsg').className='message bad';
      }finally{
        btn.disabled=false;
        btn.textContent='Post question';
      }
    });

    SS.$('postShare').addEventListener('click',async function(){
      var text=SS.$('shareBody').value.trim();

      if(text.length<4){
        SS.$('shareMsg').textContent='Write something first.';
        SS.$('shareMsg').className='message bad';
        return;
      }

      var btn=this;
      btn.disabled=true;
      btn.textContent='Posting…';

      try{
        var r=await SS.client.from('posts').insert({
          author_member_id:SS.ctx.member.id,
          category:'discussion',
          subtype:'share',
          body:text
        });
        if(r.error)throw r.error;

        SS.$('shareBody').value='';
        closeSheet();
        await loadCommunity();
      }catch(e){
        SS.$('shareMsg').textContent=e.message||'Could not post.';
        SS.$('shareMsg').className='message bad';
      }finally{
        btn.disabled=false;
        btn.textContent='Post';
      }
    });

    document.addEventListener('click',async function(e){
      var claim=e.target.closest('[data-claim-opportunity]');
      if(claim){
        claim.disabled=true;
        try{
          var c=await SS.client.rpc('claim_opportunity',{
            p_opportunity_id:claim.dataset.claimOpportunity
          });
          if(c.error)throw c.error;
          SS.toast('Claimed. Reach out to the person who posted it.');
          await loadMatchedOpportunities();
        }catch(err){
          SS.toast(err.message);
          claim.disabled=false;
        }
        return;
      }

      var reply=e.target.closest('[data-reply]');
      if(reply){
        var postId=reply.getAttribute('data-reply');
        var input=document.querySelector('[data-reply-input="'+CSS.escape(postId)+'"]');
        var text=input&&input.value.trim();
        if(!text)return;

        reply.disabled=true;
        var rr=await SS.client.from('post_replies').insert({
          post_id:postId,
          author_member_id:SS.ctx.member.id,
          body:text
        });

        if(rr.error){
          SS.toast(rr.error.message);
          reply.disabled=false;
          return;
        }

        await loadCommunity();
        return;
      }

      var del=e.target.closest('[data-delete-post]');
      if(del){
        if(!confirm('Delete this post?'))return;
        var dr=await SS.client.from('posts').delete().eq('id',del.dataset.deletePost);
        if(dr.error){SS.toast(dr.error.message);return;}
        await loadCommunity();
      }
    });

    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'&&!SS.$('postSheet').hidden)closeSheet();
      if(e.key==='Enter'&&e.target.matches('[data-reply-input]')){
        e.preventDefault();
        var id=e.target.dataset.replyInput;
        var b=document.querySelector('[data-reply="'+CSS.escape(id)+'"]');
        if(b)b.click();
      }
    });

    await Promise.all([loadMatchedOpportunities(),loadCommunity()]);
  }catch(e){
    if(e.message!=='signin'&&e.message!=='inactive'){
      SS.pageError('matchedOpps',e.message);
    }
  }
})();
</script>
</body>
</html>
