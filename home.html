<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Home · seek+scale.</title><link rel="stylesheet" href="assets/app.css"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><link rel="icon" href="assets/icons/favicon-32.png"></head><body>
<div class="shell"><nav class="side" id="side"></nav><main><h1>What's going on</h1><p class="sub" id="today"></p><div id="feature"></div><h2>Worth knowing</h2><div class="card" id="newsList"><div class="loading">Loading…</div></div><h2>New members</h2><div id="homeList"><div class="loading">Loading…</div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
(async function(){try{await requireMember('home');document.getElementById('today').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});var all=await loadPosts(['article','news','resource'],8);var art=all.find(function(p){return p.category==='article';});document.getElementById('feature').innerHTML=art?'<div class="feat"><div class="band" style="background:#111"></div><div class="in"><div class="eyebrow">This week\'s story</div><h3>'+esc(art.title)+'</h3><p>'+esc((art.body||'').slice(0,220))+(art.body&&art.body.length>220?'…':'')+'</p><div class="by"><div><div class="tiny">'+esc(art.business_name||art.author_name||'Seek & Scale')+' · '+esc(fmtTime(art.created_at))+'</div></div><a class="act soft" style="margin-left:auto" href="article.html?id='+encodeURIComponent(art.id)+'">Read</a></div></div></div>':'';var news=all.filter(function(p){return !art||p.id!==art.id;}).slice(0,5);document.getElementById('newsList').innerHTML=news.length?news.map(function(n){return '<div class="news"><div class="tagsq">'+(n.category==='news'?'!':'↗')+'</div><div class="kd"><div class="kn">'+esc(n.title)+'</div><div class="kp">'+esc((n.body||'').slice(0,150))+'</div></div></div>';}).join(''):'<div class="empty">Nothing posted yet.</div>';var biz=await loadBusinesses();window.onVouchChange=function(){document.getElementById('homeList').innerHTML=biz.slice(0,6).map(function(b){return businessCard(b,{isNew:true});}).join('');};window.onVouchChange();}catch(e){if(e.message!=='signin'&&e.message!=='pending'&&e.message!=='suspended')showPageError('newsList',e.message);}})();
</script></body></html>
