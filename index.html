<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Sign in · seek+scale.</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="seek+scale">
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">seek<i>+</i><br>scale.</div>
  <p class="login-tag">A business resource community for Austin service business owners.</p>

  <div id="configWarning"></div>
  <div id="loginBox">
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" placeholder="you@yourshop.com"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn wide" id="signIn">Sign in</button>
    <p class="tiny" id="msg" style="text-align:center;margin-top:14px"></p>
    <p class="tiny" style="text-align:center;margin-top:22px">Not a member yet? <a class="linkish" href="join.html">See what this is</a></p>
  </div>

  <div id="pendingBox" hidden>
    <div class="card flat">
      <div style="font-size:18px;font-weight:800">One more step.</div>
      <p class="tiny">Your account exists, but it still needs a valid invite code.</p>
      <div class="field"><label for="invite">Invite code</label><input id="invite" placeholder="SS-XXXXXXXX" autocapitalize="characters"></div>
      <button class="btn wide" id="redeem">Activate my account</button>
      <button class="btn wide ghost" id="pendingOut" style="margin-top:9px">Sign out</button>
      <p class="tiny" id="pendingMsg" style="text-align:center;margin-top:12px"></p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  initSupabase();
  var msg=document.getElementById('msg');
  if(configMessage(document.getElementById('configWarning'))){ document.getElementById('signIn').disabled=true; return; }

  function setMsg(t,bad){msg.textContent=t||'';msg.style.color=bad?'#B4302A':'var(--muted)';}
  function setPendingMsg(t,bad){var m=document.getElementById('pendingMsg');m.textContent=t||'';m.style.color=bad?'#B4302A':'var(--muted)';}
  async function routeSignedIn(){
    try{
      var p=await getMyProfile();
      if(!p) return;
      if(p.status==='active' && p.billing_status!=='past_due' && p.billing_status!=='canceled'){
        var next=sessionStorage.getItem('ss_after_login');sessionStorage.removeItem('ss_after_login');
        location.replace(next&&next.indexOf(location.origin)===0?next:'home.html'); return;
      }
      if(p.billing_status==='past_due'||p.billing_status==='canceled'){
        await sb.auth.signOut(); setMsg('Your membership billing is inactive. Contact Seek & Scale to restore access.',true); return;
      }
      if(p.status==='suspended'){
        await sb.auth.signOut(); setMsg('This membership is suspended. Contact Seek & Scale if that looks wrong.',true); return;
      }
      document.getElementById('loginBox').hidden=true;
      document.getElementById('pendingBox').hidden=false;
      var saved=localStorage.getItem('ss_pending_invite')||'';
      if(saved) document.getElementById('invite').value=saved;
    }catch(e){setMsg(e.message,true);}
  }

  document.getElementById('signIn').onclick=async function(){
    this.disabled=true;setMsg('Checking…');
    var r=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
    this.disabled=false;
    if(r.error) return setMsg(r.error.message,true);
    routeSignedIn();
  };
  document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('signIn').click();});

  document.getElementById('redeem').onclick=async function(){
    var code=document.getElementById('invite').value.trim(); if(!code)return setPendingMsg('Enter your invite code.',true);
    this.disabled=true;setPendingMsg('Activating…');
    var r=await sb.rpc('redeem_invite',{p_code:code}); this.disabled=false;
    if(r.error) return setPendingMsg(r.error.message,true);
    if(!r.data||!r.data.ok) return setPendingMsg((r.data&&r.data.error)||'That invite could not be used.',true);
    localStorage.removeItem('ss_pending_invite');
    var next=sessionStorage.getItem('ss_after_login');sessionStorage.removeItem('ss_after_login');
    location.replace(next&&next.indexOf(location.origin)===0?next:'home.html');
  };
  document.getElementById('pendingOut').onclick=signOut;

  var m=qs('message');
  if(m==='signin')setMsg('Sign in to open the member app.');
  if(m==='invite')setMsg('Sign in, then enter your invite code.');
  if(m==='suspended')setMsg('This membership is suspended.',true);
  if(m==='billing')setMsg('Your membership billing is inactive. Contact Seek & Scale to restore access.',true);

  sb.auth.getSession().then(function(s){if(s.data.session)routeSignedIn();});
})();
</script>
</body>
</html>
