<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Sign in · seek+scale.</title>
<link rel="stylesheet" href="assets/app.css?v=community-v1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/favicon-32.png">
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">seek<i>+</i><br>scale.</div>
  <p class="login-tag">The private room for local service-business owners.</p>

  <div class="field">
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" placeholder="Your email">
  </div>
  <div class="field">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Your password">
  </div>

  <button class="btn wide" id="go" type="button">Sign in</button>
  <div class="message" id="msg" aria-live="polite"></div>

  <p class="tiny" style="text-align:center;margin-top:20px">
    Membership is invite-only. Use the private invite link you received to create an account.
  </p>
  <p class="tiny" style="text-align:center;margin-top:16px">
    Admin? <a href="admin/" style="font-weight:750;text-decoration:underline">Open Admin</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js?v=community-v1"></script>
<script>
(function(){
  var em=document.getElementById('em'),pw=document.getElementById('pw'),go=document.getElementById('go'),msg=document.getElementById('msg');
  function show(t,bad){msg.textContent=t||'';msg.className='message '+(bad?'bad':'');}
  var client=null;
  try{client=initSupabase();}catch(e){show('The app connection did not load.',true);go.disabled=true;}

  async function verifyAndEnter(){
    var u=await client.auth.getUser();
    if(u.error||!u.data.user) throw new Error('Could not verify your account.');
    var r=await client.from('members').select('id,status').eq('auth_user_id',u.data.user.id).maybeSingle();
    if(r.error) throw r.error;
    if(!r.data||r.data.status!=='active'){
      await client.auth.signOut();
      throw new Error('This account is not active yet.');
    }
    location.replace('home.html');
  }

  async function signin(){
    var email=em.value.trim(),password=pw.value;
    if(!email||!password)return show('Enter your email and password.',true);
    go.disabled=true;go.textContent='Signing in…';show('');
    try{
      var r=await client.auth.signInWithPassword({email:email,password:password});
      if(r.error)throw r.error;
      await verifyAndEnter();
    }catch(e){
      show(e.message||'Could not sign in.',true);
      go.disabled=false;go.textContent='Sign in';
    }
  }

  go.addEventListener('click',signin);
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')signin();});

  (async function(){
    if(!client)return;
    try{
      var s=await client.auth.getSession();
      if(s.data&&s.data.session) await verifyAndEnter();
      var state=new URLSearchParams(location.search).get('state');
      if(state==='inactive') show('This account is not active.',true);
    }catch(e){}
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  })();
})();
</script>
</body>
</html>
