<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111"><title>Me · seek+scale.</title>
<link rel="stylesheet" href="assets/app.css?v=community-v1"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><link rel="icon" href="assets/icons/favicon-32.png">
</head><body>
<header class="top" id="top"></header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main>
    <div style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1"><h1>Me</h1><p class="sub">Keep your member profile useful and current.</p></div>
      <button class="pill" id="signout" type="button">Sign out</button>
    </div>

    <div id="identity"></div>

    <div class="card">
      <h2 style="margin-top:0">Profile picture</h2>
      <div style="display:flex;align-items:center;gap:14px">
        <div id="photoPreview" class="profile-photo" style="margin:0;width:76px;height:76px;flex:none"></div>
        <div style="flex:1">
          <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <button class="act solid" id="changePhoto" type="button">Change photo</button>
          <div class="tiny" style="margin-top:7px">JPG, PNG or WebP · up to 5 MB</div>
        </div>
      </div>
      <div class="message" id="photoMsg" aria-live="polite"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">Your profile</h2>
      <div class="field"><label for="fullName">Your name</label><input id="fullName" placeholder="Your name"></div>
      <div class="field"><label for="headline">Headline</label><input id="headline" placeholder="What you do in one short line"></div>
      <div class="field"><label for="bio">About you</label><textarea id="bio" placeholder="A short useful introduction"></textarea></div>
      <div class="field"><label for="lookingFor">What are you looking for?</label><textarea id="lookingFor" placeholder="A person, problem, opportunity or connection"></textarea></div>
      <div class="field"><label for="phone">Your phone</label><input id="phone" placeholder="Your phone number"></div>
      <div class="field"><label for="instagram">Instagram</label><input id="instagram" placeholder="Your Instagram link"></div>
      <div class="field"><label for="linkedin">LinkedIn</label><input id="linkedin" placeholder="Your LinkedIn link"></div>

      <h2>Business</h2>
      <div class="field"><label for="businessName">Business name</label><input id="businessName" placeholder="Your business name"></div>
      <div class="field"><label for="trade">Trade</label><input id="trade" placeholder="Your trade"></div>
      <div class="field"><label for="city">Town</label><input id="city" placeholder="Your town"></div>
      <div class="field"><label for="does">What do you do?</label><textarea id="does" placeholder="What your business does"></textarea></div>
      <div class="field"><label for="helps">How can you help other members?</label><textarea id="helps" placeholder="What you are useful for"></textarea></div>
      <div class="field"><label for="businessPhone">Business phone</label><input id="businessPhone" placeholder="Business phone"></div>
      <div class="field"><label for="businessEmail">Business email</label><input id="businessEmail" type="email" placeholder="Business email"></div>
      <div class="field"><label for="website">Website</label><input id="website" placeholder="Website"></div>

      <h2>Privacy</h2>
      <div class="privacy">
        <label class="checkline"><input id="showEmail" type="checkbox"> Show my member email</label>
        <label class="checkline"><input id="showPhone" type="checkbox"> Show my phone</label>
        <label class="checkline"><input id="showSocials" type="checkbox"> Show my social links</label>
      </div>

      <button class="btn wide" id="save" type="button">Save profile</button>
      <div class="message" id="msg" aria-live="polite"></div>
      <div class="tiny">Business logo and banner are still managed by Admin.</div>
    </div>
  </main>
</div>
<nav class="tabs" id="tabs"></nav>
<a class="help-fab" href="helpdesk.html">Get help</a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js?v=community-v1"></script>
<script src="assets/app.js?v=community-v1"></script>
<script>
(async function(){
  try{
    await SS.requireMember('me');
    SS.$('signout').addEventListener('click',SS.signOut);

    function fill(){
      var m=SS.ctx.member,b=SS.ctx.business||{};
      SS.$('identity').innerHTML='<div class="card flat" style="display:flex;gap:12px;align-items:center">'+SS.avatar(m)+
        '<div><strong>'+SS.esc(m.full_name)+'</strong><div class="tiny">'+SS.esc(SS.businessLine(m,b))+'</div></div></div>';

      SS.$('photoPreview').innerHTML=m.profile_photo_url
        ? '<img src="'+SS.esc(m.profile_photo_url)+'" alt="" style="width:100%;height:100%;object-fit:cover">'
        : SS.esc(SS.initials(m.full_name));

      SS.$('fullName').value=m.full_name||'';SS.$('headline').value=m.headline||'';SS.$('bio').value=m.bio||'';
      SS.$('lookingFor').value=m.looking_for||'';SS.$('phone').value=m.phone||'';SS.$('instagram').value=m.instagram_url||'';
      SS.$('linkedin').value=m.linkedin_url||'';SS.$('showEmail').checked=!!m.show_email;SS.$('showPhone').checked=!!m.show_phone;
      SS.$('showSocials').checked=!!m.show_socials;SS.$('businessName').value=b.name||'';SS.$('trade').value=b.trade||'';
      SS.$('city').value=b.city||'';SS.$('does').value=b.what_they_do||'';SS.$('helps').value=b.helps_with||'';
      SS.$('businessPhone').value=b.contact_phone||'';SS.$('businessEmail').value=b.contact_email||'';SS.$('website').value=b.website||'';
    }

    SS.$('changePhoto').addEventListener('click',function(){
      SS.$('photoInput').click();
    });

    SS.$('photoInput').addEventListener('change',async function(){
      var file=this.files&&this.files[0];
      if(!file)return;

      var allowed={
        'image/jpeg':'jpg',
        'image/png':'png',
        'image/webp':'webp'
      };

      if(!allowed[file.type]){
        SS.$('photoMsg').textContent='Use a JPG, PNG or WebP image.';
        SS.$('photoMsg').className='message bad';
        this.value='';
        return;
      }

      if(file.size>5*1024*1024){
        SS.$('photoMsg').textContent='That image is larger than 5 MB.';
        SS.$('photoMsg').className='message bad';
        this.value='';
        return;
      }

      var button=SS.$('changePhoto');
      button.disabled=true;
      button.textContent='Uploading…';
      SS.$('photoMsg').textContent='';

      try{
        var path=SS.ctx.member.id+'/profile-'+Date.now()+'.'+allowed[file.type];

        var upload=await SS.client.storage
          .from('member-media')
          .upload(path,file,{
            cacheControl:'3600',
            upsert:false,
            contentType:file.type
          });

        if(upload.error)throw upload.error;

        var publicResult=SS.client.storage
          .from('member-media')
          .getPublicUrl(path);

        var publicUrl=publicResult&&publicResult.data
          ? publicResult.data.publicUrl
          : '';

        if(!publicUrl)throw new Error('Could not create the photo URL.');

        var savePhoto=await SS.client.rpc('update_my_profile_photo',{
          p_profile_photo_url:publicUrl
        });

        if(savePhoto.error)throw savePhoto.error;

        var fresh=await SS.getMember(SS.ctx.member.id);
        if(fresh){
          SS.ctx.member=fresh.member;
          SS.ctx.business=fresh.business;
          fill();
        }

        SS.$('photoMsg').textContent='Profile picture updated.';
        SS.$('photoMsg').className='message good';
      }catch(e){
        SS.$('photoMsg').textContent=e.message||'Could not update your profile picture.';
        SS.$('photoMsg').className='message bad';
      }finally{
        button.disabled=false;
        button.textContent='Change photo';
        SS.$('photoInput').value='';
      }
    });

    SS.$('save').addEventListener('click',async function(){
      var btn=this;btn.disabled=true;btn.textContent='Saving…';SS.$('msg').textContent='';
      var r=await SS.client.rpc('update_my_profile',{
        p_full_name:SS.$('fullName').value,
        p_headline:SS.$('headline').value,
        p_bio:SS.$('bio').value,
        p_looking_for:SS.$('lookingFor').value,
        p_phone:SS.$('phone').value,
        p_instagram_url:SS.$('instagram').value,
        p_linkedin_url:SS.$('linkedin').value,
        p_show_email:SS.$('showEmail').checked,
        p_show_phone:SS.$('showPhone').checked,
        p_show_socials:SS.$('showSocials').checked,
        p_business_name:SS.$('businessName').value,
        p_trade:SS.$('trade').value,
        p_city:SS.$('city').value,
        p_what_they_do:SS.$('does').value,
        p_helps_with:SS.$('helps').value,
        p_contact_phone:SS.$('businessPhone').value,
        p_contact_email:SS.$('businessEmail').value,
        p_website:SS.$('website').value
      });
      btn.disabled=false;btn.textContent='Save profile';
      if(r.error){SS.$('msg').textContent=r.error.message;SS.$('msg').className='message bad';return;}
      SS.$('msg').textContent='Profile saved.';SS.$('msg').className='message good';
      var id=SS.ctx.member.id;
      var fresh=await SS.getMember(id);
      if(fresh){SS.ctx.member=fresh.member;SS.ctx.business=fresh.business;fill();}
    });
    fill();
  }catch(e){if(e.message!=='signin'&&e.message!=='inactive')SS.pageError('identity',e.message);}
})();
</script></body></html>
