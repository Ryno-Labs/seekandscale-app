<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Me · seek+scale.</title><link rel="stylesheet" href="assets/app.css"><link rel="manifest" href="manifest.json"></head><body><div class="shell"><nav class="side" id="side"></nav><main><h1>Your account</h1><p class="sub">Keep your member details current.</p><div class="card"><div class="profile-grid"><div class="field"><label for="name">Your name</label><input id="name"></div><div class="field"><label for="biz">Business name</label><input id="biz"></div><div class="field"><label for="trade">Trade / category</label><input id="trade"></div><div class="field"><label for="town">Town</label><input id="town"></div><div class="field"><label for="zone">Area</label><select id="zone"><option value="">—</option></select></div></div><div class="profile-actions"><button class="btn sm" id="save">Save profile</button><button class="act soft" id="out">Sign out</button></div><p class="tiny" id="profileMsg"></p></div><h2>Your directory listing</h2><div id="myBusiness"><div class="loading">Loading…</div></div><h2>Your forum posts</h2><div class="card" id="myPosts"></div><h2>Shops you vouched for</h2><div class="card" id="myVouches"></div><div class="card flat" style="margin-top:22px"><div class="tiny">Need to change or cancel a paid membership? Email <span id="contact"></span>.</div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
(async function(){try{await requireMember('me');var zones=await loadZones();document.getElementById('zone').innerHTML='<option value="">—</option>'+zones.map(function(z){return '<option value="'+z.id+'">'+esc(z.name)+'</option>';}).join('');function fill(){document.getElementById('name').value=SS.profile.full_name||'';document.getElementById('biz').value=SS.profile.business_name||'';document.getElementById('trade').value=SS.profile.trade||'';document.getElementById('town').value=SS.profile.town||'';document.getElementById('zone').value=SS.profile.zone_id||'';}fill();document.getElementById('contact').textContent=SITE_CONTACT_EMAIL;document.getElementById('out').onclick=signOut;document.getElementById('save').onclick=async function(){this.disabled=true;var m=document.getElementById('profileMsg');m.textContent='Saving…';try{await updateMyProfile({full_name:document.getElementById('name').value.trim(),business_name:document.getElementById('biz').value.trim(),trade:document.getElementById('trade').value.trim(),town:document.getElementById('town').value.trim(),zone_id:document.getElementById('zone').value||null});m.textContent='Saved.';}catch(e){m.textContent=e.message;}finally{this.disabled=false;}};var businesses=await loadBusinesses(),mine=businesses.filter(function(b){return b.owner_id===SS.user.id;});document.getElementById('myBusiness').innerHTML=mine.length?mine.map(function(b){return businessCard(b,{});}).join(''):'<div class="card flat"><p class="tiny" style="margin:0">Your account is active, but no directory business is linked to it yet. An admin can add or link your business from the Admin dashboard.</p></div>';var p=await sb.from('posts').select('*').eq('author_id',SS.user.id).order('created_at',{ascending:false});document.getElementById('myPosts').innerHTML=p.error?'<p class="tiny">'+esc(p.error.message)+'</p>':(p.data.length?p.data.map(function(x){return '<div class="post"><div class="who"><span class="chip">'+esc(x.category||'post')+'</span><span class="t">'+esc(fmtTime(x.created_at))+'</span><button class="act soft" style="margin-left:auto" data-del="'+x.id+'">Take it down</button></div><p class="body">'+esc(x.body||'')+'</p></div>';}).join(''):'<div class="empty">You have not posted yet.</div>');var ids=SS.vouches.filter(function(v){return v.member_id===SS.user.id;}).map(function(v){return v.business_id;});var vb=businesses.filter(function(b){return ids.indexOf(b.id)>=0;});document.getElementById('myVouches').innerHTML=vb.length?vb.map(function(b){return '<div class="kit"><div class="kd"><div class="kn">'+esc(b.name)+'</div><div class="kp">'+esc([b.category,businessTown(b)].filter(Boolean).join(' · '))+'</div></div><a class="act soft" href="shop.html?id='+encodeURIComponent(b.id)+'">Open</a></div>';}).join(''):'<div class="empty">You have not vouched for a business yet.</div>';document.addEventListener('click',async function(e){var d=e.target.closest('[data-del]');if(d&&confirm('Take this post down?')){var r=await sb.from('posts').delete().eq('id',d.dataset.del);if(r.error)alert(r.error.message);else location.reload();}});}catch(e){if(!/signin|pending|suspended/.test(e.message))showPageError('myBusiness',e.message);}})();
</script></body></html>
