<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Notifications · seek+scale.</title>
<link rel="stylesheet" href="assets/app.css?v=network32">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/favicon-32.png">
</head>
<body>
<header class="top" id="top"></header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main>
    <h1>Notifications</h1>
    <p class="sub">Mentions from people in the network.</p>
    <div id="notifications"><div class="loading">Loading notifications…</div></div>
  </main>
</div>
<nav class="tabs" id="tabs"></nav>
<a class="help-fab" href="helpdesk.html">Get help</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js?v=community-v1"></script>
<script src="assets/app.js?v=network32"></script>
<script>
(async function(){
  'use strict';

  try{
    await SS.requireMember('notifications');

    var rows=await SS.loadNotifications(100);

    SS.$('notifications').innerHTML=rows.length
      ? '<div class="notifications-list">'+rows.map(function(n){
          var actor=n.actor||{full_name:'A member'};
          var line=SS.businessLine(actor,n.actorBusiness||{});
          return '<a class="notification-row '+(!n.read_at?'unread':'')+'" href="home.html#post-'+encodeURIComponent(n.post_id)+'">'+
            SS.avatar(actor)+
            '<div class="notification-main">'+
              '<strong>'+SS.esc(actor.full_name||'A member')+' mentioned you '+(n.reply_id?'in a reply':'in a post')+'.</strong>'+
              (line?'<div class="notification-copy">'+SS.esc(line)+'</div>':'')+
              (n.preview?'<div class="notification-preview">'+SS.esc(n.preview)+'</div>':'')+
              '<div class="notification-time">'+SS.esc(SS.fmtTime(n.created_at))+'</div>'+
            '</div>'+
          '</a>';
        }).join('')+'</div>'
      : '<div class="card"><div class="empty"><strong>Nothing needs you here yet.</strong><br>When another member @mentions you, it will show up here.</div></div>';

    if(rows.some(function(n){return !n.read_at;})){
      await SS.markAllNotificationsRead();
    }
  }catch(e){
    if(e.message!=='signin'&&e.message!=='inactive'&&e.message!=='legal'){
      SS.pageError('notifications',e.message);
    }
  }
})();
</script>
</body>
</html>
