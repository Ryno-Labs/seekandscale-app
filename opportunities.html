<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Opportunities · seek+scale.</title>
<link rel="stylesheet" href="assets/app.css?v=ux2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/favicon-32.png">
</head>
<body>
<header class="top" id="top"></header>

<div class="shell">
  <aside class="side" id="side"></aside>

  <main>
    <div class="compact-page-head">
      <div class="head-copy">
        <h1>Opportunities</h1>
        <p class="sub">Work and useful connections moving through the network.</p>
      </div>
      <button class="btn sm post-button" id="openNew" type="button">+ Post</button>
    </div>

    <div class="opp-filter-row" id="filters">
      <button class="opp-filter on" data-filter="open">Open</button>
      <button class="opp-filter" data-filter="claimed">Claimed</button>
      <button class="opp-filter" data-filter="mine">Mine</button>
      <button class="opp-filter" data-filter="closed">Closed</button>
    </div>

    <div id="list"><div class="loading">Loading opportunities…</div></div>
  </main>
</div>

<nav class="tabs" id="tabs"></nav>
<a class="help-fab" href="helpdesk.html">Get help</a>

<!-- NEW OPPORTUNITY SHEET -->
<div class="sheet-backdrop" id="newSheet" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="newTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="newTitle">Post an opportunity</h2>
      <button class="sheet-close" id="closeNew" type="button" aria-label="Close">×</button>
    </div>

    <div class="field">
      <label for="need">What do you need?</label>
      <textarea id="need" maxlength="500" placeholder="Need a plumber for a customer with a leaking water heater"></textarea>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="trade">Trade / person needed</label>
        <input id="trade" maxlength="120" list="tradeList" placeholder="Plumbing">
        <datalist id="tradeList"></datalist>
      </div>

      <div class="field">
        <label for="city">Where?</label>
        <input id="city" maxlength="120" list="cityList" placeholder="Georgetown">
        <datalist id="cityList"></datalist>
      </div>
    </div>

    <div class="field">
      <label for="timing">When?</label>
      <select id="timing">
        <option value="">Choose timing</option>
        <option>Today</option>
        <option>Next 2 days</option>
        <option>This week</option>
        <option>Next 2 weeks</option>
        <option>Flexible</option>
      </select>
    </div>

    <div class="field">
      <label for="details">Anything else? <span class="dim">(optional)</span></label>
      <textarea id="details" maxlength="4000" placeholder="Anything the right person should know."></textarea>
    </div>

    <button class="btn wide" id="createBtn" type="button">Post opportunity</button>
    <div class="message" id="createMsg"></div>
  </section>
</div>

<!-- OUTCOME SHEET -->
<div class="sheet-backdrop" id="closeSheet" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="closeTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="closeTitle">What happened?</h2>
      <button class="sheet-close" id="cancelClose" type="button" aria-label="Close">×</button>
    </div>

    <p class="tiny" style="margin-top:-5px">Record the result so the network can measure real value.</p>

    <div class="field">
      <label for="outcome">Outcome</label>
      <select id="outcome">
        <option value="">Choose outcome</option>
        <option value="work_connected">Work connected</option>
        <option value="referral_made">Referral made</option>
        <option value="hire_made">Hire made</option>
        <option value="connection_made">Useful connection made</option>
        <option value="no_outcome">No outcome</option>
        <option value="cancelled">No longer needed / cancelled</option>
        <option value="other">Other</option>
      </select>
    </div>

    <button class="btn wide" id="confirmClose" type="button">Close opportunity</button>
    <div class="message" id="closeMsg"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js?v=community-v1"></script>
<script src="assets/app.js?v=ux2"></script>
<script>
(async function(){
  'use strict';

  var all=[];
  var filter='open';
  var closeId=null;

  function matchScore(o){
    return SS.opportunityMatchScore(o,SS.ctx.business);
  }

  function needsOutcomeNudge(o){
    return o.poster_member_id===SS.ctx.member.id &&
      o.status==='claimed' &&
      o.claimed_at &&
      Date.now()-new Date(o.claimed_at).getTime() >= 7*24*60*60*1000;
  }

  function row(o){
    var mine=o.poster_member_id===SS.ctx.member.id;
    var claimedByMe=o.claimed_by_member_id===SS.ctx.member.id;
    var poster=o.poster||{full_name:'Member'};
    var claimer=o.claimer||null;
    var score=matchScore(o);

    return '<article class="opp-row">'+
      '<div class="opp-row-head">'+
        '<div class="opp-row-main">'+
          '<div class="opp-row-title">'+SS.esc(o.need)+'</div>'+
          '<div class="opp-row-meta">'+SS.esc(o.trade_needed)+' · '+SS.esc(o.city)+' · '+SS.esc(o.timing)+'</div>'+
        '</div>'+
        '<span class="opp-status '+SS.esc(o.status)+'">'+SS.esc(o.status)+'</span>'+
      '</div>'+
      (o.details?'<div class="opp-row-details">'+SS.esc(o.details)+'</div>':'')+
      '<div class="opp-row-meta" style="margin-top:9px">Posted by '+SS.esc(poster.full_name||'Member')+' · '+SS.esc(SS.fmtTime(o.created_at))+'</div>'+
      (o.status==='claimed'
        ? '<div class="opp-row-meta">Claimed by '+SS.esc(claimer?claimer.full_name:'a member')+'</div>'
        : '')+
      (o.status==='closed'&&o.outcome
        ? '<div class="opp-row-meta"><strong>Result:</strong> '+SS.esc(SS.opportunityOutcomeLabel(o.outcome))+'</div>'
        : '')+
      (needsOutcomeNudge(o)
        ? '<div class="card yellow" style="padding:10px 12px;margin:10px 0 0"><div class="tiny"><strong>7-day check:</strong> Did this turn into something?</div></div>'
        : '')+
      '<div class="opp-row-actions">'+
        (o.status==='open'&&!mine
          ? '<button class="act solid" type="button" data-claim="'+SS.esc(o.id)+'">Claim</button>'
          : '')+
        (o.status==='open'&&score>=2
          ? '<span class="chip yellow">'+(score>=3?'Strong match':'Trade match')+'</span>'
          : '')+
        (o.status==='claimed'&&(claimedByMe||mine)
          ? '<button class="act" type="button" data-release="'+SS.esc(o.id)+'">Release claim</button>'
          : '')+
        ((o.status==='open'||o.status==='claimed')&&mine
          ? '<button class="act" type="button" data-close="'+SS.esc(o.id)+'">Close & record result</button>'
          : '')+
        (o.status==='closed'&&mine
          ? '<button class="act" type="button" data-reopen="'+SS.esc(o.id)+'">Reopen</button>'
          : '')+
        '<a class="act" style="margin-left:auto" href="shop.html?id='+encodeURIComponent(o.poster_member_id)+'">View poster</a>'+
      '</div>'+
    '</article>';
  }

  function render(){
    var rows=all.slice();

    if(filter==='open')rows=rows.filter(function(o){return o.status==='open';});
    if(filter==='claimed')rows=rows.filter(function(o){return o.status==='claimed';});
    if(filter==='closed')rows=rows.filter(function(o){return o.status==='closed';});
    if(filter==='mine')rows=rows.filter(function(o){
      return o.poster_member_id===SS.ctx.member.id ||
        o.claimed_by_member_id===SS.ctx.member.id;
    });

    if(filter==='open'){
      rows.sort(function(a,b){
        var diff=matchScore(b)-matchScore(a);
        if(diff)return diff;
        return new Date(b.created_at)-new Date(a.created_at);
      });
    }

    SS.$('list').innerHTML=rows.length
      ? '<div class="opp-list">'+rows.map(row).join('')+'</div>'
      : '<div class="priority-list"><div class="priority-item">'+
          '<div class="priority-item-title">Nothing here right now.</div>'+
          '<div class="priority-item-meta">That is okay. Real opportunities only.</div>'+
        '</div></div>';
  }

  async function load(){
    all=await SS.loadOpportunities(null,200);
    render();
  }

  async function seedLists(){
    var r=await SS.client.from('businesses')
      .select('trade,city')
      .eq('status','active');

    if(r.error)return;

    var trades=Array.from(new Set(
      (r.data||[]).map(function(x){return (x.trade||'').trim();}).filter(Boolean)
    )).sort();

    var cities=Array.from(new Set(
      (r.data||[]).map(function(x){return (x.city||'').trim();}).filter(Boolean)
    )).sort();

    SS.$('tradeList').innerHTML=trades.map(function(x){
      return '<option value="'+SS.esc(x)+'"></option>';
    }).join('');

    SS.$('cityList').innerHTML=cities.map(function(x){
      return '<option value="'+SS.esc(x)+'"></option>';
    }).join('');
  }

  function openNew(){
    SS.$('newSheet').hidden=false;
    setTimeout(function(){SS.$('need').focus();},0);
  }

  function closeNew(){
    SS.$('newSheet').hidden=true;
    if(location.hash==='#new'){
      history.replaceState(null,'',location.pathname+location.search);
    }
  }

  try{
    await SS.requireMember('opportunities');
    await seedLists();

    SS.$('openNew').addEventListener('click',openNew);
    SS.$('closeNew').addEventListener('click',closeNew);
    SS.$('newSheet').addEventListener('click',function(e){
      if(e.target===SS.$('newSheet'))closeNew();
    });

    if(location.hash==='#new')openNew();

    SS.$('createBtn').addEventListener('click',async function(){
      var need=SS.$('need').value.trim();
      var trade=SS.$('trade').value.trim();
      var city=SS.$('city').value.trim();
      var timing=SS.$('timing').value;
      var details=SS.$('details').value.trim();

      if(!need||!trade||!city||!timing){
        SS.$('createMsg').textContent='Add what you need, the trade, where, and when.';
        SS.$('createMsg').className='message bad';
        return;
      }

      var btn=this;
      btn.disabled=true;
      btn.textContent='Posting…';

      try{
        var r=await SS.client.rpc('create_opportunity',{
          p_need:need,
          p_trade_needed:trade,
          p_city:city,
          p_timing:timing,
          p_details:details||null
        });
        if(r.error)throw r.error;

        SS.$('need').value='';
        SS.$('trade').value='';
        SS.$('city').value='';
        SS.$('timing').value='';
        SS.$('details').value='';
        closeNew();

        filter='open';
        document.querySelectorAll('.opp-filter').forEach(function(x){
          x.classList.toggle('on',x.dataset.filter==='open');
        });

        await load();
      }catch(e){
        SS.$('createMsg').textContent=e.message||'Could not post opportunity.';
        SS.$('createMsg').className='message bad';
      }finally{
        btn.disabled=false;
        btn.textContent='Post opportunity';
      }
    });

    SS.$('filters').addEventListener('click',function(e){
      var b=e.target.closest('[data-filter]');
      if(!b)return;

      filter=b.dataset.filter;
      document.querySelectorAll('.opp-filter').forEach(function(x){
        x.classList.toggle('on',x===b);
      });
      render();
    });

    SS.$('list').addEventListener('click',async function(e){
      var claim=e.target.closest('[data-claim]');
      if(claim){
        claim.disabled=true;
        try{
          var r=await SS.client.rpc('claim_opportunity',{
            p_opportunity_id:claim.dataset.claim
          });
          if(r.error)throw r.error;
          SS.toast('Claimed. Reach out to the person who posted it.');
          await load();
        }catch(err){
          SS.toast(err.message);
          claim.disabled=false;
        }
        return;
      }

      var release=e.target.closest('[data-release]');
      if(release){
        if(!confirm('Release this claim and make it open again?'))return;

        release.disabled=true;
        try{
          var rr=await SS.client.rpc('release_opportunity',{
            p_opportunity_id:release.dataset.release
          });
          if(rr.error)throw rr.error;
          await load();
        }catch(err){
          SS.toast(err.message);
          release.disabled=false;
        }
        return;
      }

      var close=e.target.closest('[data-close]');
      if(close){
        closeId=close.dataset.close;
        SS.$('outcome').value='';
        SS.$('closeMsg').textContent='';
        SS.$('closeSheet').hidden=false;
        return;
      }

      var reopen=e.target.closest('[data-reopen]');
      if(reopen){
        if(!confirm('Reopen this opportunity?'))return;

        reopen.disabled=true;
        try{
          var ro=await SS.client.rpc('reopen_opportunity',{
            p_opportunity_id:reopen.dataset.reopen
          });
          if(ro.error)throw ro.error;
          filter='open';
          await load();
        }catch(err){
          SS.toast(err.message);
          reopen.disabled=false;
        }
      }
    });

    SS.$('cancelClose').addEventListener('click',function(){
      SS.$('closeSheet').hidden=true;
      closeId=null;
    });

    SS.$('closeSheet').addEventListener('click',function(e){
      if(e.target===SS.$('closeSheet')){
        SS.$('closeSheet').hidden=true;
        closeId=null;
      }
    });

    SS.$('confirmClose').addEventListener('click',async function(){
      if(!closeId)return;

      var outcome=SS.$('outcome').value;
      if(!outcome){
        SS.$('closeMsg').textContent='Choose what happened first.';
        SS.$('closeMsg').className='message bad';
        return;
      }

      var btn=this;
      btn.disabled=true;
      btn.textContent='Closing…';

      try{
        var r=await SS.client.rpc('close_opportunity',{
          p_opportunity_id:closeId,
          p_outcome:outcome
        });
        if(r.error)throw r.error;

        SS.$('closeSheet').hidden=true;
        closeId=null;
        await load();
      }catch(err){
        SS.$('closeMsg').textContent=err.message||'Could not close opportunity.';
        SS.$('closeMsg').className='message bad';
      }finally{
        btn.disabled=false;
        btn.textContent='Close opportunity';
      }
    });

    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'){
        if(!SS.$('newSheet').hidden)closeNew();
        if(!SS.$('closeSheet').hidden){
          SS.$('closeSheet').hidden=true;
          closeId=null;
        }
      }
    });

    await load();
  }catch(e){
    if(e.message!=='signin'&&e.message!=='inactive'){
      SS.pageError('list',e.message);
    }
  }
})();
</script>
</body>
</html>
