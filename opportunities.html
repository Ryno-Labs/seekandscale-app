<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Opportunities · seek+scale.</title>
<link rel="stylesheet" href="assets/app.css?v=network3"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><link rel="icon" href="assets/icons/favicon-32.png"></head><body>
<header class="top" id="top"></header><div class="shell"><aside class="side" id="side"></aside><main>
<div class="compact-page-head"><div class="head-copy"><h1>Opportunities</h1><p class="sub">Work, referrals, hiring, talent and useful requests moving through the network.</p></div><button class="btn sm post-button" id="openNew" type="button">+ Post</button></div>
<div class="opp-filter-row" id="typeFilters"><button class="opp-filter on" data-type="all">All</button><button class="opp-filter" data-type="work">Work</button><button class="opp-filter" data-type="referral">Referrals</button><button class="opp-filter" data-type="hiring">Hiring</button><button class="opp-filter" data-type="talent">Talent</button><button class="opp-filter" data-type="need">Needs</button></div>
<div class="opp-filter-row" id="statusFilters"><button class="opp-filter on" data-status="open">Open</button><button class="opp-filter" data-status="claimed">Claimed</button><button class="opp-filter" data-status="mine">Mine</button><button class="opp-filter" data-status="closed">Closed</button></div>
<div id="list"><div class="loading">Loading opportunities…</div></div></main></div><nav class="tabs" id="tabs"></nav><a class="help-fab" href="helpdesk.html">Get help</a>

<div class="sheet-backdrop" id="newSheet" hidden><section class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><h2>Post an opportunity</h2><button class="sheet-close" id="closeNew" type="button">×</button></div>
<div class="field"><label for="oppType">Type</label><select id="oppType"><option value="work">Work / subcontractor</option><option value="referral">Customer referral</option><option value="hiring">Hiring</option><option value="talent">Talent available</option><option value="need">Need / request</option></select></div>
<div class="field"><label for="need">What is happening?</label><textarea id="need" maxlength="700" placeholder="Need a plumber for a customer with a leaking water heater"></textarea></div>
<div class="grid2"><div class="field"><label for="trade">Trade / skill / person</label><input id="trade" maxlength="120" list="tradeList" placeholder="Plumbing"><datalist id="tradeList"></datalist></div><div class="field"><label for="city">Where?</label><input id="city" maxlength="120" list="cityList" placeholder="Georgetown"><datalist id="cityList"></datalist></div></div>
<div class="field"><label for="timing">When?</label><select id="timing"><option value="">Choose timing</option><option>Today</option><option>Next 2 days</option><option>This week</option><option>Next 2 weeks</option><option>Flexible</option></select></div>
<div class="field"><label for="details">Anything else? <span class="dim">(optional)</span></label><textarea id="details" maxlength="4000"></textarea></div><button class="btn wide" id="createBtn" type="button">Post opportunity</button><div class="message" id="createMsg"></div></section></div>

<div class="sheet-backdrop" id="closeSheet" hidden><section class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><h2>What happened?</h2><button class="sheet-close" id="cancelClose" type="button">×</button></div>
<div class="field"><label for="outcome">Outcome</label><select id="outcome"><option value="">Choose outcome</option><option value="work_connected">Work connected</option><option value="referral_made">Referral made</option><option value="hire_made">Hire made</option><option value="connection_made">Useful connection made</option><option value="no_outcome">No outcome</option><option value="cancelled">Cancelled / no longer needed</option><option value="other">Other</option></select></div>
<div class="field"><label for="value">Approx. value created <span class="dim">(optional)</span></label><input id="value" type="number" min="0" step="1" placeholder="2500"></div>
<div class="field"><label for="outcomeNote">What happened? <span class="dim">(optional)</span></label><textarea id="outcomeNote" maxlength="2000" placeholder="Short result note"></textarea></div><button class="btn wide" id="confirmClose" type="button">Close & record result</button><div class="message" id="closeMsg"></div></section></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="assets/config.js?v=community-v1"></script><script src="assets/app.js?v=network3"></script>
<script>(async function(){
  'use strict';var all=[],status='open',type='all',closeId=null,saved=new Set();
  function score(o){return SS.opportunityMatchScore(o,SS.ctx.business);}function money(v){return v==null?'':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v);}
  function row(o){var mine=o.poster_member_id===SS.ctx.member.id,claimed=o.claimed_by_member_id===SS.ctx.member.id,poster=o.poster||{full_name:'Member'},claimer=o.claimer||null,s=score(o),savedOn=saved.has('opportunity:'+o.id);return '<article class="opp-row"><div class="opp-row-head"><div class="opp-row-main"><div style="display:flex;gap:6px;align-items:center;margin-bottom:5px"><span class="post-badge '+(o.status==='open'?'yellow':'')+'">'+SS.esc(SS.opportunityTypeLabel(o.opportunity_type))+'</span><span class="opp-status '+SS.esc(o.status)+'">'+SS.esc(o.status)+'</span></div><div class="opp-row-title">'+SS.esc(o.need)+'</div><div class="opp-row-meta">'+SS.esc(o.trade_needed)+' · '+SS.esc(o.city)+' · '+SS.esc(o.timing)+'</div></div></div>'+(o.details?'<div class="opp-row-details">'+SS.esc(o.details)+'</div>':'')+'<div class="opp-row-meta" style="margin-top:9px">Posted by '+SS.esc(poster.full_name)+' · '+SS.esc(SS.fmtTime(o.created_at))+'</div>'+(o.status==='claimed'?'<div class="opp-row-meta">Claimed by '+SS.esc(claimer?claimer.full_name:'a member')+'</div>':'')+(o.status==='closed'&&o.outcome?'<div class="opp-row-meta"><strong>Result:</strong> '+SS.esc(SS.opportunityOutcomeLabel(o.outcome))+(o.reported_value?' · '+SS.esc(money(o.reported_value)):'')+(o.outcome_note?' · '+SS.esc(o.outcome_note):'')+'</div>':'')+'<div class="opp-row-actions">'+(o.status==='open'&&!mine?'<button class="act solid" data-claim="'+SS.esc(o.id)+'" type="button">Claim</button>':'')+(o.status==='open'&&s>=2?'<span class="chip yellow">'+(s>=3?'Strong match':'Trade match')+'</span>':'')+(o.status==='claimed'&&(claimed||mine)?'<button class="act" data-release="'+SS.esc(o.id)+'" type="button">Release claim</button>':'')+((o.status==='open'||o.status==='claimed')&&mine?'<button class="act" data-close="'+SS.esc(o.id)+'" type="button">Close & record result</button>':'')+(o.status==='closed'&&mine?'<button class="act" data-reopen="'+SS.esc(o.id)+'" type="button">Reopen</button>':'')+'<button class="act '+(savedOn?'saved-on':'')+'" data-save-item="opportunity" data-save-id="'+SS.esc(o.id)+'" type="button">'+(savedOn?'Saved':'Save')+'</button><a class="act" style="margin-left:auto" href="shop.html?id='+encodeURIComponent(o.poster_member_id)+'">View poster</a></div></article>';}
  function render(){var rows=all.filter(function(o){if(type!=='all'&&o.opportunity_type!==type)return false;if(status==='mine')return o.poster_member_id===SS.ctx.member.id||o.claimed_by_member_id===SS.ctx.member.id;return o.status===status;});if(status==='open')rows.sort(function(a,b){var d=score(b)-score(a);return d||new Date(b.created_at)-new Date(a.created_at);});SS.$('list').innerHTML=rows.length?'<div class="opp-list">'+rows.map(row).join('')+'</div>':'<div class="priority-list"><div class="priority-item"><div class="priority-item-title">Nothing here right now.</div><div class="priority-item-meta">Real opportunities only.</div></div></div>';}
  async function load(){all=await SS.loadOpportunities(null,250);render();}
  async function seed(){var r=await SS.client.from('businesses').select('trade,city').eq('status','active');if(r.error)return;var trades=Array.from(new Set((r.data||[]).map(function(x){return(x.trade||'').trim();}).filter(Boolean))).sort(),cities=Array.from(new Set((r.data||[]).map(function(x){return(x.city||'').trim();}).filter(Boolean))).sort();SS.$('tradeList').innerHTML=trades.map(function(x){return '<option value="'+SS.esc(x)+'">';}).join('');SS.$('cityList').innerHTML=cities.map(function(x){return '<option value="'+SS.esc(x)+'">';}).join('');}
  function openNew(){var p=new URLSearchParams(location.search),t=p.get('type');if(t&&['work','referral','hiring','talent','need'].indexOf(t)!==-1)SS.$('oppType').value=t;SS.$('newSheet').hidden=false;setTimeout(function(){SS.$('need').focus();},0);}function closeNew(){SS.$('newSheet').hidden=true;if(location.hash==='#new')history.replaceState(null,'',location.pathname);}
  try{await SS.requireMember('opportunities');saved=await SS.loadSavedSet();await seed();SS.$('openNew').addEventListener('click',openNew);SS.$('closeNew').addEventListener('click',closeNew);SS.$('newSheet').addEventListener('click',function(e){if(e.target===SS.$('newSheet'))closeNew();});if(location.hash==='#new')openNew();
    SS.$('typeFilters').addEventListener('click',function(e){var b=e.target.closest('[data-type]');if(!b)return;type=b.dataset.type;SS.$('typeFilters').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});render();});SS.$('statusFilters').addEventListener('click',function(e){var b=e.target.closest('[data-status]');if(!b)return;status=b.dataset.status;SS.$('statusFilters').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});render();});
    SS.$('createBtn').addEventListener('click',async function(){var need=SS.$('need').value.trim(),trade=SS.$('trade').value.trim(),city=SS.$('city').value.trim(),timing=SS.$('timing').value;if(!need||!trade||!city||!timing){SS.$('createMsg').textContent='Add what is happening, the trade or skill, where, and when.';SS.$('createMsg').className='message bad';return;}var btn=this;btn.disabled=true;btn.textContent='Posting…';try{var r=await SS.client.rpc('create_opportunity_v2',{p_opportunity_type:SS.$('oppType').value,p_need:need,p_trade_needed:trade,p_city:city,p_timing:timing,p_details:SS.$('details').value.trim()||null});if(r.error)throw r.error;['need','trade','city','details'].forEach(function(id){SS.$(id).value='';});SS.$('timing').value='';closeNew();status='open';await load();}catch(e){SS.$('createMsg').textContent=e.message;SS.$('createMsg').className='message bad';}finally{btn.disabled=false;btn.textContent='Post opportunity';}});
    SS.$('list').addEventListener('click',async function(e){var save=e.target.closest('[data-save-item]');if(save){save.disabled=true;try{var yes=await SS.toggleSave('opportunity',save.dataset.saveId);if(yes)saved.add('opportunity:'+save.dataset.saveId);else saved.delete('opportunity:'+save.dataset.saveId);save.textContent=yes?'Saved':'Save';save.classList.toggle('saved-on',yes);}catch(err){SS.toast(err.message);}finally{save.disabled=false;}return;}var claim=e.target.closest('[data-claim]');if(claim){claim.disabled=true;try{var c=await SS.client.rpc('claim_opportunity',{p_opportunity_id:claim.dataset.claim});if(c.error)throw c.error;await load();}catch(err){SS.toast(err.message);claim.disabled=false;}return;}var release=e.target.closest('[data-release]');if(release){if(!confirm('Release this claim?'))return;var rr=await SS.client.rpc('release_opportunity',{p_opportunity_id:release.dataset.release});if(rr.error)SS.toast(rr.error.message);else await load();return;}var close=e.target.closest('[data-close]');if(close){closeId=close.dataset.close;SS.$('outcome').value='';SS.$('value').value='';SS.$('outcomeNote').value='';SS.$('closeSheet').hidden=false;return;}var reopen=e.target.closest('[data-reopen]');if(reopen){if(!confirm('Reopen this opportunity?'))return;var ro=await SS.client.rpc('reopen_opportunity',{p_opportunity_id:reopen.dataset.reopen});if(ro.error)SS.toast(ro.error.message);else await load();}});
    SS.$('cancelClose').addEventListener('click',function(){SS.$('closeSheet').hidden=true;closeId=null;});SS.$('confirmClose').addEventListener('click',async function(){var outcome=SS.$('outcome').value;if(!outcome){SS.$('closeMsg').textContent='Choose what happened.';SS.$('closeMsg').className='message bad';return;}var btn=this;btn.disabled=true;btn.textContent='Closing…';try{var value=SS.$('value').value?Number(SS.$('value').value):null;var r=await SS.client.rpc('close_opportunity_v2',{p_opportunity_id:closeId,p_outcome:outcome,p_reported_value:value,p_outcome_note:SS.$('outcomeNote').value.trim()||null});if(r.error)throw r.error;SS.$('closeSheet').hidden=true;closeId=null;await load();}catch(e){SS.$('closeMsg').textContent=e.message;SS.$('closeMsg').className='message bad';}finally{btn.disabled=false;btn.textContent='Close & record result';}});await load();
  }catch(e){if(e.message!=='signin'&&e.message!=='inactive')SS.pageError('list',e.message);}
})();</script></body></html>
