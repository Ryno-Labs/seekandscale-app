<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111"><title>Opportunities · seek+scale.</title>
<link rel="stylesheet" href="assets/app.css?v=community-v1"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><link rel="icon" href="assets/icons/favicon-32.png">
</head><body>
<header class="top" id="top"></header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main>
    <h1>Opportunities</h1>
    <p class="sub">Work, referrals, people and openings worth passing around.</p>

    <div class="card composer">
      <textarea id="body" placeholder="What opportunity should the room know about?" maxlength="4000"></textarea>
      <div class="composer-foot">
        <select id="subtype">
          <option value="referral">Referral</option>
          <option value="work">Work</option>
          <option value="hiring">Hiring</option>
          <option value="need">Looking for</option>
          <option value="other">Other</option>
        </select>
        <button class="btn sm" id="post" type="button" disabled>Post</button>
      </div>
      <div class="message" id="msg"></div>
    </div>

    <h2>Open room</h2>
    <div class="card" id="list"><div class="loading">Loading opportunities…</div></div>
  </main>
</div>
<nav class="tabs" id="tabs"></nav>
<a class="help-fab" href="helpdesk.html">Get help</a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js?v=community-v1"></script>
<script src="assets/app.js?v=community-v1"></script>
<script>
(async function(){
  try{
    await SS.requireMember('opportunities');
    var body=SS.$('body'),post=SS.$('post'),subtype=SS.$('subtype');
    body.addEventListener('input',function(){post.disabled=body.value.trim().length<4;});

    post.addEventListener('click',async function(){
      var text=body.value.trim();if(text.length<4)return;
      post.disabled=true;post.textContent='Posting…';
      var r=await SS.client.from('posts').insert({
        author_member_id:SS.ctx.member.id,category:'opportunity',subtype:subtype.value,body:text
      });
      post.textContent='Post';
      if(r.error){SS.$('msg').textContent=r.error.message;SS.$('msg').className='message bad';post.disabled=false;return;}
      body.value='';SS.$('msg').textContent='Opportunity posted.';SS.$('msg').className='message good';await load();
    });

    async function load(){
      var posts=await SS.loadPosts(['opportunity'],100);
      SS.$('list').innerHTML=posts.length?posts.map(function(p){
        var m=p.author||{full_name:'Member'},b=p.business||{};
        return '<article class="feed-post"><div class="post-head">'+SS.avatar(m)+
          '<div class="post-meta"><div class="post-name">'+SS.esc(m.full_name)+'</div><div class="post-business">'+SS.esc(SS.businessLine(m,b))+'</div></div>'+
          '<span class="chip yellow">'+SS.esc(p.subtype||'opportunity')+'</span></div>'+
          '<div class="post-body">'+SS.esc(p.body)+'</div><div class="post-tools"><span class="tiny">'+SS.esc(SS.fmtTime(p.created_at))+'</span>'+
          (p.author_member_id===SS.ctx.member.id?'<button class="act danger" type="button" data-delete="'+SS.esc(p.id)+'">Delete</button>':'')+
          '</div></article>';
      }).join(''):'<div class="empty">No opportunities posted yet.</div>';
    }

    SS.$('list').addEventListener('click',async function(e){
      var d=e.target.closest('[data-delete]');if(!d)return;
      if(!confirm('Delete this opportunity?'))return;
      var r=await SS.client.from('posts').delete().eq('id',d.getAttribute('data-delete'));
      if(r.error){SS.toast(r.error.message);return;}await load();
    });

    await load();
  }catch(e){if(e.message!=='signin'&&e.message!=='inactive')SS.pageError('list',e.message);}
})();
</script></body></html>
