<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111"><title>Resources · seek+scale.</title>
<link rel="stylesheet" href="assets/app.css?v=community-v1"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><link rel="icon" href="assets/icons/favicon-32.png">
</head><body>
<header class="top" id="top"></header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main>
    <h1>Resources</h1>
    <p class="sub">Useful things for getting unstuck and moving the business forward.</p>
    <div class="searchbox"><input id="search" type="search" placeholder="Search resources"></div>
    <div class="card" id="list"><div class="loading">Loading resources…</div></div>
  </main>
</div>
<nav class="tabs" id="tabs"></nav>
<a class="help-fab" href="helpdesk.html">Get help</a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js?v=community-v1"></script>
<script src="assets/app.js?v=community-v1"></script>
<script>
(async function(){
  try{
    await SS.requireMember('resources');
    var all=await SS.loadPosts(['resource'],200);
    function render(){
      var q=SS.$('search').value.trim().toLowerCase();
      var rows=all.filter(function(p){return !q||((p.body||'')+' '+(p.subtype||'')).toLowerCase().indexOf(q)!==-1;});
      SS.$('list').innerHTML=rows.length?rows.map(function(p){
        var m=p.author||{full_name:'Seek & Scale'};
        return '<article class="resource"><div class="status-line">'+
          '<span class="chip yellow">'+SS.esc(p.subtype||'resource')+'</span>'+
          '<span class="tiny">'+SS.esc(SS.fmtDate(p.created_at))+'</span></div>'+
          '<div class="resource-body">'+SS.esc(p.body)+'</div>'+
          '<div class="tiny">Shared by '+SS.esc(m.full_name||'Seek & Scale')+'</div></article>';
      }).join(''):'<div class="empty">No resources here yet.</div>';
    }
    SS.$('search').addEventListener('input',render);render();
  }catch(e){if(e.message!=='signin'&&e.message!=='inactive')SS.pageError('list',e.message);}
})();
</script></body></html>
